<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BDU Abituriyent Köməkçisi — Bakı Dövlət Universitetinə qəbul üzrə sual-cavab" />
    <title>BDU Abituriyent Köməkçisi</title>
    <script>
      // Apply theme before first paint — no flash of wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("bdu-faq:settings");
          var theme = stored ? JSON.parse(stored).state.theme : "system";
          var dark =
            theme === "dark" ||
            (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
